services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quest
      POSTGRES_PASSWORD: quest
      POSTGRES_DB: quest_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quest_test
      POSTGRES_PASSWORD: quest_test
      POSTGRES_DB: quest_test
    ports:
      - "5433:5432"

volumes:
  pgdata:
